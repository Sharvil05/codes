<!DOCTYPE html>
<html>
    <head>
        <title>Colspan</title>
    </head>

    <body>

        <table border="1">
            
            <thead>
                <tr>
                    <th colspan="3">Quarterly Sales Report</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <th>Month</th>
                    <th>Product</th>
                    <th>Sales</th>
                </tr>

                <tr>
                    <td>January</td>
                    <td>Laptop</td>
                    <td>50,000</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="2" style="text-align: center;">Total</td>
                    <td>50,000</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
