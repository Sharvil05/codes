<!DOCTYPE html>
<html>
    <head>
        <title>Rowspan Example</title>
    </head>
    <body>

        <table border="1">
            <thead>
                <tr>
                    <th>Department</th>
                    <th>Employee</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td rowspan="2">IT</td>
                    <td>Amit</td>
                </tr>
                <tr>
                    <td>Sneha</td>
                </tr>

                <tr>
                    <td rowspan="2">HR</td>
                    <td>Kavya</td>
                </tr>
                <tr>
                    <td>Rahul</td>
                
                </tr>
            </tbody>
        </table>
    </body>
</html>
