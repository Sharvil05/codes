<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigntment One</title>
</head>

<body>
    <form>
        <h1>Registration Form</h1>

        <fieldset>

            <legend>Registration Information</legend>

            <label>Full Name : </label>
            <input type="text" placeholder="Sharvil Punekar">
            <br><br>

            <label>Password : </label>
            <input type="password" placeholder="***********" minlength="5" maxlength="10">
            <br><br>

            <label>Email : </label>
            <input type="email" placeholder="abc@gmail.com">
            <br><br>

            <label>Age : </label>
            <input type="number" placeholder="21">
            <br><br>

            <label>Gender : </label>
            <input type="radio" checked>Male
            <input type="radio">Female
            <input type="radio">Other
            <br><br>

            <label>Hobbies : </label>
            <input type="checkbox">Coding
            <input type="checkbox">Sports
            <input type="checkbox">MUSIC
            <br><br>

            <label>Favourite Colour : </label>
            <input type="color">
            <br><br>

            <label>Upload Resume : </label>
            <input type="file">
            <br><br>

            <input type="submit">

        </fieldset>


</body>

</html>
