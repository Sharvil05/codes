<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table First</title>
</head>
<body>

    <table border="1">
        <caption>Items Table</caption>

        <thead>
            <tr>
                <th>Items</th>
                <th>Quantity</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Biryani</td>
                <td>1</td>
                <td>450</td>
            </tr>

            <tr>
                <td>Pizza</td>
                <td>2</td>
                <td>650</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2" style="text-align: center;">Total</td>
                <td>1150</td>
            </tr>
        </tfoot>
    </table>
</body>
